name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify Firebase Secrets
        run: |
          echo "Checking if Firebase secrets are configured..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ ERROR: FIREBASE_API_KEY secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ ERROR: FIREBASE_PROJECT_ID secret is not configured!"
            exit 1
          fi
          echo "✅ Firebase secrets appear to be configured"

      - name: Inject Firebase Config into HTML
        run: |
          echo "Injecting Firebase config directly into index.html..."

          # Use a simpler approach - create temp file with replacement content
          echo "    <script>" > /tmp/firebase_replacement.txt
          echo "    const firebaseConfig = {" >> /tmp/firebase_replacement.txt
          echo "      apiKey: \"${{ secrets.FIREBASE_API_KEY }}\"," >> /tmp/firebase_replacement.txt
          echo "      authDomain: \"${{ secrets.FIREBASE_AUTH_DOMAIN }}\"," >> /tmp/firebase_replacement.txt
          echo "      projectId: \"${{ secrets.FIREBASE_PROJECT_ID }}\"," >> /tmp/firebase_replacement.txt
          echo "      storageBucket: \"${{ secrets.FIREBASE_STORAGE_BUCKET }}\"," >> /tmp/firebase_replacement.txt
          echo "      messagingSenderId: \"${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}\"," >> /tmp/firebase_replacement.txt
          echo "      appId: \"${{ secrets.FIREBASE_APP_ID }}\"," >> /tmp/firebase_replacement.txt
          echo "      measurementId: \"${{ secrets.FIREBASE_MEASUREMENT_ID }}\"" >> /tmp/firebase_replacement.txt
          echo "    };" >> /tmp/firebase_replacement.txt
          echo "    firebase.initializeApp(firebaseConfig);" >> /tmp/firebase_replacement.txt
          echo "    const db = firebase.firestore();" >> /tmp/firebase_replacement.txt
          echo "    const auth = firebase.auth();" >> /tmp/firebase_replacement.txt
          echo "    console.log('Firebase initialized successfully');" >> /tmp/firebase_replacement.txt
          echo "    </script>" >> /tmp/firebase_replacement.txt

          echo "Replacement content:"
          cat /tmp/firebase_replacement.txt

          # Use awk to replace the line
          awk '/<script src="firebase-config.js"><\/script>/{system("cat /tmp/firebase_replacement.txt");next}1' index.html > index.html.tmp
          mv index.html.tmp index.html

          echo "Verifying injection..."
          if grep -q "const firebaseConfig" index.html; then
            echo "✅ Verification: Firebase config found in index.html"
            grep -A 5 "const firebaseConfig" index.html | head -10
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files to deploy directory..."
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='nul' \
            --exclude='.claude' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='firebase-config.js' \
            --exclude='firebase-config.example.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='CHECKLIST-*' \
            --exclude='COMO-*' \
            --exclude='CONFIGURAR-*' \
            --exclude='GUIA-*' \
            --exclude='README*' \
            --exclude='CAMBIOS-*' \
            --exclude='setup-*' \
            --exclude='configurar-*' \
            . deploy/

          echo "✅ Files copied to deploy directory"
          echo "Verifying index.html has Firebase config..."
          if grep -q "const firebaseConfig" deploy/index.html; then
            echo "✅ Firebase config found in index.html"
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

          echo "Listing deploy directory root files..."
          ls -lah deploy/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          enable_jekyll: false
          keep_files: false
          commit_message: 'Deploy with inline Firebase config'

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify Firebase Secrets
        run: |
          echo "Checking if Firebase secrets are configured..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ ERROR: FIREBASE_API_KEY secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ ERROR: FIREBASE_PROJECT_ID secret is not configured!"
            exit 1
          fi
          echo "✅ Firebase secrets appear to be configured"

      - name: Create Firebase Config File
        run: |
          echo "Creating firebase-config.js with secrets..."

          cat > firebase-config.js << 'FIREBASE_CONFIG_EOF'
const firebaseConfig = {
  apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
  authDomain: "FIREBASE_AUTH_DOMAIN_PLACEHOLDER",
  projectId: "FIREBASE_PROJECT_ID_PLACEHOLDER",
  storageBucket: "FIREBASE_STORAGE_BUCKET_PLACEHOLDER",
  messagingSenderId: "FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER",
  appId: "FIREBASE_APP_ID_PLACEHOLDER",
  measurementId: "FIREBASE_MEASUREMENT_ID_PLACEHOLDER"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

console.log('Firebase initialized successfully');
FIREBASE_CONFIG_EOF

          # Replace placeholders with actual secrets
          sed -i "s/FIREBASE_API_KEY_PLACEHOLDER/${{ secrets.FIREBASE_API_KEY }}/g" firebase-config.js
          sed -i "s/FIREBASE_AUTH_DOMAIN_PLACEHOLDER/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" firebase-config.js
          sed -i "s/FIREBASE_PROJECT_ID_PLACEHOLDER/${{ secrets.FIREBASE_PROJECT_ID }}/g" firebase-config.js
          sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" firebase-config.js
          sed -i "s/FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" firebase-config.js
          sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${{ secrets.FIREBASE_APP_ID }}|g" firebase-config.js
          sed -i "s/FIREBASE_MEASUREMENT_ID_PLACEHOLDER/${{ secrets.FIREBASE_MEASUREMENT_ID }}/g" firebase-config.js

          echo "✅ firebase-config.js created successfully"
          echo "Content:"
          cat firebase-config.js

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files to deploy directory..."
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='nul' \
            --exclude='.claude' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='firebase-config.example.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='CHECKLIST-*' \
            --exclude='COMO-*' \
            --exclude='CONFIGURAR-*' \
            --exclude='GUIA-*' \
            --exclude='README*' \
            --exclude='CAMBIOS-*' \
            --exclude='setup-*' \
            --exclude='configurar-*' \
            . deploy/

          echo "✅ Files copied to deploy directory"
          echo "Verifying firebase-config.js exists in deploy..."
          if [ -f deploy/firebase-config.js ]; then
            echo "✅ firebase-config.js found in deploy directory"
            echo "File size:"
            ls -lh deploy/firebase-config.js
          else
            echo "❌ ERROR: firebase-config.js not found in deploy!"
            exit 1
          fi

          echo "Listing deploy directory root files..."
          ls -lah deploy/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          enable_jekyll: false
          keep_files: false
          commit_message: 'Deploy with inline Firebase config'

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create firebase-config.js
        run: |
          cat > firebase-config.js << 'FIREBASE_EOF'
          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          firebase.initializeApp(firebaseConfig);
          const db = firebase.firestore();
          const auth = firebase.auth();
          FIREBASE_EOF

      - name: Verify firebase-config.js was created
        run: |
          echo "Checking if firebase-config.js exists..."
          ls -lah firebase-config.js
          echo "Content preview:"
          head -5 firebase-config.js

      - name: Force add firebase-config.js (ignore gitignore)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f firebase-config.js
          echo "firebase-config.js added to git staging (forced)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts,nul,.claude'
          force_orphan: true
          enable_jekyll: false

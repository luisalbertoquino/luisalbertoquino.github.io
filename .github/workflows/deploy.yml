name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify Firebase Secrets
        run: |
          echo "Checking if Firebase secrets are configured..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ ERROR: FIREBASE_API_KEY secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ ERROR: FIREBASE_PROJECT_ID secret is not configured!"
            exit 1
          fi
          echo "✅ Firebase secrets appear to be configured"

      - name: Inject Firebase Config into HTML
        run: |
          echo "Injecting Firebase config directly into index.html..."

          cat > inject_firebase.py << 'EOF'
import re
import sys
import os

api_key = os.environ.get('FIREBASE_API_KEY', '')
auth_domain = os.environ.get('FIREBASE_AUTH_DOMAIN', '')
project_id = os.environ.get('FIREBASE_PROJECT_ID', '')
storage_bucket = os.environ.get('FIREBASE_STORAGE_BUCKET', '')
messaging_sender_id = os.environ.get('FIREBASE_MESSAGING_SENDER_ID', '')
app_id = os.environ.get('FIREBASE_APP_ID', '')
measurement_id = os.environ.get('FIREBASE_MEASUREMENT_ID', '')

with open('index.html', 'r', encoding='utf-8') as f:
    html_content = f.read()

firebase_config = f'''    <script>
    const firebaseConfig = {{
      apiKey: "{api_key}",
      authDomain: "{auth_domain}",
      projectId: "{project_id}",
      storageBucket: "{storage_bucket}",
      messagingSenderId: "{messaging_sender_id}",
      appId: "{app_id}",
      measurementId: "{measurement_id}"
    }};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    console.log('Firebase initialized successfully');
    </script>'''

html_content = re.sub(r'<script src="firebase-config\.js"></script>', firebase_config, html_content)

with open('index.html', 'w', encoding='utf-8') as f:
    f.write(html_content)

print("✅ Firebase config injected successfully")
EOF

          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
          FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
          FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
          FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
          FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
          FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
          FIREBASE_MEASUREMENT_ID="${{ secrets.FIREBASE_MEASUREMENT_ID }}" \
          python3 inject_firebase.py

          echo "Verifying injection..."
          if grep -q "const firebaseConfig" index.html; then
            echo "✅ Verification: Firebase config found in index.html"
            grep -A 5 "const firebaseConfig" index.html | head -10
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files to deploy directory..."
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='nul' \
            --exclude='.claude' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='firebase-config.js' \
            --exclude='firebase-config.example.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='CHECKLIST-*' \
            --exclude='COMO-*' \
            --exclude='CONFIGURAR-*' \
            --exclude='GUIA-*' \
            --exclude='README*' \
            --exclude='CAMBIOS-*' \
            --exclude='setup-*' \
            --exclude='configurar-*' \
            . deploy/

          echo "✅ Files copied to deploy directory"
          echo "Verifying index.html has Firebase config..."
          if grep -q "const firebaseConfig" deploy/index.html; then
            echo "✅ Firebase config found in index.html"
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

          echo "Listing deploy directory root files..."
          ls -lah deploy/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: false
          enable_jekyll: false
          keep_files: true
          commit_message: 'Deploy with firebase-config.js'

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create firebase-config.js
        run: |
          cat > firebase-config.js << 'FIREBASE_EOF'
          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          firebase.initializeApp(firebaseConfig);
          const db = firebase.firestore();
          const auth = firebase.auth();
          FIREBASE_EOF

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files except excluded ones..."
          rsync -av --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='nul' --exclude='.claude' --exclude='deploy' . deploy/

          echo "Copying firebase-config.js to deploy directory..."
          cp firebase-config.js deploy/

          echo "Verifying firebase-config.js in deploy directory..."
          ls -lah deploy/firebase-config.js
          echo "Content preview:"
          head -5 deploy/firebase-config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          enable_jekyll: false

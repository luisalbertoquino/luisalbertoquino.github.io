name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify Firebase Secrets
        run: |
          echo "Checking if Firebase secrets are configured..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ ERROR: FIREBASE_API_KEY secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ ERROR: FIREBASE_PROJECT_ID secret is not configured!"
            exit 1
          fi
          echo "✅ Firebase secrets appear to be configured"

      - name: Inject Firebase Config into HTML
        run: |
          echo "Injecting Firebase config directly into index.html..."

          python3 << 'PYTHON_SCRIPT'
import re

# Read index.html
with open('index.html', 'r', encoding='utf-8') as f:
    html_content = f.read()

# Firebase config to inject
firebase_config = '''    <script>
    const firebaseConfig = {
      apiKey: "${{ secrets.FIREBASE_API_KEY }}",
      authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
      projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
      storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
      messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
      appId: "${{ secrets.FIREBASE_APP_ID }}",
      measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    console.log('Firebase initialized successfully');
    </script>'''

# Replace the script tag
html_content = re.sub(
    r'<script src="firebase-config\.js"></script>',
    firebase_config,
    html_content
)

# Write back
with open('index.html', 'w', encoding='utf-8') as f:
    f.write(html_content)

print("✅ Firebase config injected successfully")
PYTHON_SCRIPT

          echo "Verifying injection..."
          if grep -q "const firebaseConfig" index.html; then
            echo "✅ Verification: Firebase config found in index.html"
            grep -A 5 "const firebaseConfig" index.html | head -10
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files to deploy directory..."
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='nul' \
            --exclude='.claude' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='firebase-config.js' \
            --exclude='firebase-config.example.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='CHECKLIST-*' \
            --exclude='COMO-*' \
            --exclude='CONFIGURAR-*' \
            --exclude='GUIA-*' \
            --exclude='README*' \
            --exclude='CAMBIOS-*' \
            --exclude='setup-*' \
            --exclude='configurar-*' \
            . deploy/

          echo "✅ Files copied to deploy directory"
          echo "Verifying index.html has Firebase config..."
          if grep -q "const firebaseConfig" deploy/index.html; then
            echo "✅ Firebase config found in index.html"
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

          echo "Listing deploy directory root files..."
          ls -lah deploy/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: false
          enable_jekyll: false
          keep_files: true
          commit_message: 'Deploy with firebase-config.js'

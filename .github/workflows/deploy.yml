name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify Firebase Secrets
        run: |
          echo "Checking if Firebase secrets are configured..."
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
            echo "❌ ERROR: FIREBASE_API_KEY secret is not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ ERROR: FIREBASE_PROJECT_ID secret is not configured!"
            exit 1
          fi
          echo "✅ Firebase secrets appear to be configured"

      - name: Inject Firebase Config into HTML
        run: |
          echo "Injecting Firebase config directly into index.html..."

          # Create Firebase config as a temporary file
          cat > firebase-inline.txt << 'FIREBASE_EOF'
    <script>
    const firebaseConfig = {
      apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
      authDomain: "FIREBASE_AUTH_DOMAIN_PLACEHOLDER",
      projectId: "FIREBASE_PROJECT_ID_PLACEHOLDER",
      storageBucket: "FIREBASE_STORAGE_BUCKET_PLACEHOLDER",
      messagingSenderId: "FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER",
      appId: "FIREBASE_APP_ID_PLACEHOLDER",
      measurementId: "FIREBASE_MEASUREMENT_ID_PLACEHOLDER"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    console.log('Firebase initialized successfully');
    </script>
FIREBASE_EOF

          # Replace placeholders with actual secrets
          sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|${{ secrets.FIREBASE_API_KEY }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_AUTH_DOMAIN_PLACEHOLDER|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_PROJECT_ID_PLACEHOLDER|${{ secrets.FIREBASE_PROJECT_ID }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${{ secrets.FIREBASE_APP_ID }}|g" firebase-inline.txt
          sed -i "s|FIREBASE_MEASUREMENT_ID_PLACEHOLDER|${{ secrets.FIREBASE_MEASUREMENT_ID }}|g" firebase-inline.txt

          # Replace the script tag in index.html with the inline config
          sed -i '/<script src="firebase-config.js"><\/script>/r firebase-inline.txt' index.html
          sed -i '/<script src="firebase-config.js"><\/script>/d' index.html

          echo "✅ Firebase config injected into index.html"
          echo "Verifying injection..."
          if grep -q "const firebaseConfig" index.html; then
            echo "✅ Firebase config found in index.html"
            grep -A 8 "const firebaseConfig" index.html | head -12
          else
            echo "❌ ERROR: Firebase config not found!"
            exit 1
          fi

      - name: Prepare deployment directory
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Copying all files to deploy directory..."
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='nul' \
            --exclude='.claude' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='firebase-config.js' \
            --exclude='firebase-config.example.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.bat' \
            --exclude='CHECKLIST-*' \
            --exclude='COMO-*' \
            --exclude='CONFIGURAR-*' \
            --exclude='GUIA-*' \
            --exclude='README*' \
            --exclude='CAMBIOS-*' \
            --exclude='setup-*' \
            --exclude='configurar-*' \
            . deploy/

          echo "✅ Files copied to deploy directory"
          echo "Verifying index.html has Firebase config..."
          if grep -q "const firebaseConfig" deploy/index.html; then
            echo "✅ Firebase config found in index.html"
          else
            echo "❌ ERROR: Firebase config not found in index.html!"
            exit 1
          fi

          echo "Listing deploy directory root files..."
          ls -lah deploy/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: false
          enable_jekyll: false
          keep_files: true
          commit_message: 'Deploy with firebase-config.js'
